# NAMESPACED ProviderConfig -- kind: ProviderConfig in group aws.m.upbound.io.
#
# This is the v2 split that is easy to get wrong. There are four kinds:
#   aws.m.upbound.io/ClusterProviderConfig  (Cluster scope)
#   aws.m.upbound.io/ProviderConfig         (Namespaced scope)  <-- this one
#   aws.upbound.io/ProviderConfig           (Cluster, legacy v1)
#   aws.upbound.io/ProviderConfigUsage      (Cluster, legacy v1)
#
# Every namespaced MR must set spec.providerConfigRef.kind explicitly. The field
# defaults to ClusterProviderConfig, so omitting it silently points at a
# cluster-scoped object that does not exist here.
#
# Note: secretRef requires an explicit namespace even on the namespaced variant,
# so a ProviderConfig can read a Secret from ANY namespace. Namespacing does not
# by itself contain credential blast radius -- RBAC does.
apiVersion: aws.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: aws-lab
spec:
  credentials:
    source: Secret
    secretRef:
      name: aws-creds
      namespace: aws-lab
      key: credentials
